stop_losses:
  C:
    stop_loss_condition: symbol == 'AMD' and 1 == 2

  P:
    stop_loss_condition: symbol == 'TSLA' and available_quantity != 0 and  1 == 2


take_profits:
  t1:
    condition: current_ask > avg_cost_for_1_contract * 1.20 and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.5

  t2:
    condition: current_ask > avg_cost_for_1_contract * 1.4  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.25

  t3:
    condition: current_ask > avg_cost_for_1_contract * 1.6  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: -1    # -1 closes all the rest

  t4_close_levels: # when lines are close ...
    condition: >
      (right == 'C' and is_next_level_close_a_price_crossed(side='up', level=level_used_to_open, current_price=underlying_current_price, underlying_open_price=underlying_open_price ))
      or
      (right == 'P' and is_next_level_close_a_price_crossed(side='down', level=level_used_to_open, current_price=underlying_current_price, underlying_open_price=underlying_open_price ))
    close_quantity_percentage: 0.5

  t5_even:
    condition: >
      (right == 'C' and is_executed_take_profits(symbol, take_profit_list=['t1']) and underlying_current_price < underlying_open_price)
      or
      (right == 'P' and is_executed_take_profits(symbol, take_profit_list=['t1']) and underlying_current_price > underlying_open_price)
    close_quantity_percentage: -1

  t6_close_all:  # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    condition: 1 == 2
    close_quantity_percentage: -1

