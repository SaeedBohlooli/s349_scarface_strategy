cases:
  case_1:
    memo: trade if the levels are close to each other
    precondition: all_levels_in(symbol)  # , 'back_test'
    can_replace_level: false
    long:
      level: max(levels['PDH'], levels['PMH'], levels['5MH'])
      condition_01: breakout_in_last_x_candles(side='up', idx_list=[-5], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: are_levels_close_to_each_other_for_case_1(side='up')
      condition_08: 1 == 1
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09

    short:
      level: min(levels['PDL'], levels['PML'], levels['5ML'])
      condition_01: breakout_in_last_x_candles(side='down', idx_list=[-5], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: are_levels_close_to_each_other_for_case_1(side='down')
      condition_08: 1 == 1
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10

  case_2:
    memo: This is trading on 5MH and 5ML - release candidate
    can_replace_level: true
    precondition: all_levels_in(symbol)
    long:
      level: levels['5MH']
      condition_01: breakout_in_last_x_candles(side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='up', price=price, current_level=long_level, next_levels=['PDH'])
      condition_08: 1 == 1
      condition_09: 930 < last_record_hh_mm < 1016 or mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09
    short:
      level: levels['5ML']
      condition_01: breakout_in_last_x_candles(side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='down', price=price, current_level=short_level, next_levels=['PDL'])
      condition_08: 1 == 1
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10

  case_2_1:
    memo: 5MH and 5ML breakout_ver_2, no short above PDH, trade close to level.
    can_replace_level: true
    precondition: all_levels_in(symbol)
    long:
      level: levels['5MH']
      condition_01: breakout_in_last_x_candles_ver_2(side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='up', price=price, current_level=long_level, next_levels=['PDH'])
      condition_08: price > application_state['symbols'][symbol]['PDL'] and application_state['symbols']['QQQ']['price'] > application_state['symbols']['QQQ']['PDL']
      condition_08_memo: no long if we below PDL for both symbol and QQQ
      condition_09: 930 < last_record_hh_mm < 1016 or mode == 'live'
      condition_10: abs (price - long_level) < 1.2 * atr_14
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09
    short:
      level: levels['5ML']
      condition_01: breakout_in_last_x_candles_ver_2(side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='down', price=price, current_level=short_level, next_levels=['PDL'])
      condition_08: price < application_state['symbols'][symbol]['PDH'] and application_state['symbols']['QQQ']['price'] < application_state['symbols']['QQQ']['PDH']
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: abs (price - short_level) < 1.2 * atr_14
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10

  case_2_2:
    memo: 5MH and 5ML. using breakout_ver_2. GAPs incorporated  - we decided to HOLD this
    can_replace_level: true
    precondition: all_levels_in(symbol)
    long:
      level: levels['5MH']
      condition_01: breakout_in_last_x_candles_ver_2(side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='up', price=price, current_level=long_level, next_levels=['PDH'])
      condition_08: QQQ_gap_up_in_current_candle()
      condition_09: 930 < last_record_hh_mm < 1016 or mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09
    short:
      level: levels['5ML']
      condition_01: breakout_in_last_x_candles_ver_2(side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: not is_price_close_to_next_levels_ver_2(side='down', price=price, current_level=short_level, next_levels=['PDL'])
      condition_08: QQQ_gap_down_in_current_candle()
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10

  case_4:
    memo: From PDH
    can_replace_level: false
    precondition: mode == 'back_test'
    long:
      level: levels['PDH']
      condition_01: breakout_in_last_x_candles_ver_2(side='up', idx_list=[-3,-4,-5], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: abs (price - long_level) < 1.2 * atr_14
      condition_08: number_of_opened_trades_so_far() == 0
      condition_09: 930 < last_record_hh_mm < 940
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09
    short:
      level: levels['PDL']
      condition_01: breakout_in_last_x_candles_ver_2(side='down', idx_list=[-3,-4,-5], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: abs (price - short_level) < 1.2 * atr_14
      condition_08: number_of_opened_trades_so_far() == 0
      condition_09: 930 < last_record_hh_mm < 940
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10


  case_4_1:
    memo: This case is only for PDH and qqq stays above 5MH - we decide to NOT go with this
    can_replace_level: false
    precondition: mode == 'back_test'
    long:
      level: levels['PDH']
      condition_01: breakout_in_last_x_candles(side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level)
      condition_02: price_retest(side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='up', level=long_level)
      condition_04: check_entry_vs_retest(side='up', level=long_level)
      condition_05: no_failure_after_breakout(side='up', ohlc_field='close',level=long_level)
      condition_06: check_price_vs_level(side='up', price=price, level=long_level )
      condition_07: last_record_hh_mm < 940 and qqq_df['close'].iloc[-1] > qqq_5MH
      condition_08: number_of_opened_trades_so_far() == 0
      condition_09: 930 < last_record_hh_mm < 1016 or mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08  and eval_buy_condition_09
    short:
      level: levels['PDL']
      condition_01: breakout_in_last_x_candles(side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level)
      condition_02: price_retest(side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True )
      condition_03: is_retest_after_breakout(side='down', level=short_level)
      condition_04: check_entry_vs_retest(side='down', level=short_level)
      condition_05: no_failure_after_breakout(side='down', ohlc_field='close',level=short_level)
      condition_06: check_price_vs_level(side='down', price=price, level=short_level )
      condition_07: last_record_hh_mm < 940 and qqq_df['close'].iloc[-1] < qqq_5ML
      condition_08: number_of_opened_trades_so_far() == 0
      condition_09: 930 < last_record_hh_mm < 1016 or  mode == 'live'
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10


  case_3:
    memo: This is for Saeed's live test
    can_replace_level: false
    precondition: all_levels_in(symbol) and mode == 'live' and current_hh_mm_ny > 1100
    long:
      level: levels['5MH']
      condition_01: symbol == 'AMD' and 2 == 5000
      condition_02: mode == 'live'
      condition_03: 1 == 1
      condition_04: 1 == 1
      condition_05: 1 == 1
      condition_06: 1 == 1
      condition_07: 1 == 1
      condition_08: 1 == 1
      condition_09: 1 == 1
      condition_10: 1 == 1
      master_condition: eval_buy_condition_01 and eval_buy_condition_02 and eval_buy_condition_03 and eval_buy_condition_04 and eval_buy_condition_05 and eval_buy_condition_06 and eval_buy_condition_07 and eval_buy_condition_07 and eval_buy_condition_08 and eval_buy_condition_09

    short:
      level: levels['5MH']
      condition_01: symbol == 'AMD' and 1 == 2
      condition_02: mode == 'live'
      condition_03: 1 == 1
      condition_04: 1 == 1
      condition_05: 1 == 1
      condition_06: 1 == 1
      condition_07: 1 == 1
      condition_08: 1 == 1
      condition_09: 1 == 1
      condition_10: 1 == 1
      master_condition: eval_sell_condition_01 and eval_sell_condition_02 and eval_sell_condition_03 and eval_sell_condition_04 and eval_sell_condition_05 and eval_sell_condition_06 and eval_sell_condition_07 and eval_sell_condition_08 and eval_sell_condition_09 and eval_sell_condition_10


stop_losses:
  C:
    stop_loss_condition: underlying_previous_candle_close < level_used_to_open - tolerance_amount and ( level_used_to_open != -1)
#    stop_loss_condition:  symbol == 'AMD' or 1 == 2

  P:
    stop_loss_condition: underlying_previous_candle_close > level_used_to_open + tolerance_amount and ( level_used_to_open != -1)
#    stop_loss_condition:  symbol == 'AMD' or 1 == 1


take_profits:
  t1:
    condition: current_bid > avg_cost_for_1_contract * 1.15 and ( avg_cost_for_1_contract != -1 and current_bid != -1)
    close_quantity_percentage: 0.5

  t2:
    condition: current_bid > avg_cost_for_1_contract * 1.30  and ( avg_cost_for_1_contract != -1 and current_bid != -1)
    close_quantity_percentage: 0.25

  t3:
    condition: current_bid > avg_cost_for_1_contract * 1.60  and ( avg_cost_for_1_contract != -1 and current_bid != -1)
    close_quantity_percentage: -1

  t4_ev:
    condition: >
      (right == 'C' and is_executed_take_profits(symbol, take_profit_list=['t1']) and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(symbol, take_profit_list=['t1']) and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: -1
    memo: This is for even break - if we hit TP1, then we go for break even

  t5_cr_lv:
    condition: >
      (right == 'C' and is_price_crossed_levels(side='up', symbol=symbol, next_levels=['PDH'], current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
      or
      (right == 'P' and is_price_crossed_levels(side='down', symbol=symbol, next_levels=['PDL'], current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
    close_quantity_percentage: 0.5
    memo: if we entered below major level and crossing level, we dump some ...

  t6_trail_t1:
    condition: check_mark_revers_candles(symbol)
    close_quantity_percentage: -1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  t10_cl_manual:  # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    condition: 1 == 3 and symbol == 'AAPL'
    close_quantity_percentage: -1

  t11_cl_manual:  # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    condition: 1 == 1 and symbol == 'QQQ'
    close_quantity_percentage: -1

scores:
  s1:
    cond: df['VR'].iloc[-1] > 1.2
    score: 4
    memo: Enough volume
  s2:
    cond: intraday_rs_df['rs_rel'].iloc[-1] > 0
    score: 1
    memo: same direction as QQQ
  s3:
    cond: intraday_rs_df['stock_pct'].iloc[-1] < 0.015
    score: 1
    memo: not running too fast. less then 1.5 percent change
  s4:
    cond: qqq_5ML < qqq_df['close'].iloc[-1] < qqq_5MH and qqq_5ML != -1 and qqq_5MH != -1
    score: -4
    memo: 5ML < qqq < 5MH
  s5:
    cond: qqq_df['close'].iloc[-1] > qqq_5MH and qqq_5MH != -1 and market_trend == 'up'
    score: 4
    memo: qqq > 5MH and we going to call
  s6:
    cond: qqq_df['close'].iloc[-1] < qqq_5ML and qqq_5ML != -1 and market_trend == 'down'
    score: 4
    memo: qqq < 5ML and we going to put
  s7:
    cond: 1 == 1
    score: 0
    memo: place holder - ver2.0 of scoring.


closeness_distance: df['atr_14'].iloc[-1]

