control_panel:
  projectName: 107 Control Panel P -Edited
  browserTitle: 107 Control Panel P
  
  # Control Panel Server ports
  ports:
    vite: 7107


  # WebSocket configuration
  websocket:
    url: ws://127.0.0.1:6107
    reconnect:
      initialDelay: 1000
      maxDelay: 30000
      backoffMultiplier: 2

  # API configuration
  api:
    endpoints:
      sendRequest: /api/send-request
    tradingEngineAPI: http://127.0.0.1:5107
    controlPanelUrl: http://127.0.0.1:5109
  # Message types
  messageTypes:
    applicationState: application_state
    appConfig: app_config
  # Footer configuration
  footer:
    text: "Trading Control Panel Dashboard @ SaeedVikas.com   2014 - 2025 P"
    link: "https://VikasSaeed.com"