symbols: ['QQQ', 'AAPL', 'AMZN', 'AMD', 'NVDA', 'PLTR', 'TSLA', 'TSLL', 'MNQ', 'SPY']


stop_losses:
  C:
    stop_loss_condition: underlying_previous_candle_close < level_used_to_open - tolerance_amount and underlying_current_price < underlying_previous_candle_close

  P:
    stop_loss_condition: underlying_previous_candle_close > level_used_to_open + tolerance_amount and underlying_current_price > underlying_previous_candle_close

take_profits:
  t1:
    condition: >
      (current_bid > avg_cost_for_1_contract * 1.15 or current_bid - avg_cost_for_1_contract > 0.20)
      and avg_cost_for_1_contract not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 0.6
    memo: Taking some profit at 15% or 0.20 with 4 of 6

  t2:
    condition: > 
      (current_bid > avg_cost_for_1_contract * 1.30 or current_bid - avg_cost_for_1_contract > 0.80)
      and avg_cost_for_1_contract not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: 0.20
    memo: Taking some profit at 30% or 0.80 with 1 of 6

  t3:
    condition: >
      (current_bid > avg_cost_for_1_contract * 1.60 )
      and avg_cost_for_1_contract not in [0,-1] and current_bid not in [0,-1]
    close_quantity_percentage: -1

  t4_ev:
    condition: >
      (right == 'C' and is_executed_take_profits(application_state, symbol, take_profit_list=['t2']) and underlying_previous_candle_close < entry_underlying_price)
      or
      (right == 'P' and is_executed_take_profits(application_state, symbol, take_profit_list=['t2']) and underlying_previous_candle_close > entry_underlying_price)
    close_quantity_percentage: -1
    memo: This is for break even - if we hit TP2, then we go for break even

  t5_cr_lv:
    condition: >
      (right == 'C' and is_price_crossed_levels(application_state, side='up', symbol=symbol, next_levels=['PDH'], current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
      or
      (right == 'P' and is_price_crossed_levels(application_state, side='down', symbol=symbol, next_levels=['PDL'], current_price=underlying_current_price, entry_underlying_price=entry_underlying_price))
    close_quantity_percentage: 0.5
    memo: if we entered below major level and crossing level, we dump some ...

  t6_trail_t1:
    condition: check_mark_revers_candles(application_state, symbol,take_profit_alias='t2', market_data=market_data)
    close_quantity_percentage: -1
    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

#  t6_trail_w_ema_9:
  #    condition: symbol_df['close'].iloc[-1] < symbol_df['ema_9'].iloc[-1]  # for long after tp1, if we go below ema 9, then we close the position and vice versa for short
  #    close_quantity_percentage: -1
  #    memo: for long after tp1, if we go below last down close candle, then we close the position and vice versa for short

  t10_cl_manual:  # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    condition: 1 == 2 and symbol == 'AMZN'
    close_quantity_percentage: .5

  t11_cl_manual:  # This is for closing everything just NVDA:   1 == 1 and symbol == 'NVDA'
    condition: 1 == 3 and symbol == 'TSLA'
    close_quantity_percentage: -1

scores:
  s1:
    cond: df['VR'].iloc[-1] > 1.2
    score: 4
    memo: Enough volume
  s2:
    cond: intraday_rs_df['rs_rel'].iloc[-1] > 0
    score: 1
    memo: same direction as QQQ
  s3:
    cond: intraday_rs_df['stock_pct'].iloc[-1] < 0.015
    score: 1
    memo: not running too fast. less then 1.5 percent change
  s4:
    cond: qqq_5ML < qqq_df['close'].iloc[-1] < qqq_5MH and qqq_5ML != -1 and qqq_5MH != -1
    score: -4
    memo: 5ML < qqq < 5MH
  s5:
    cond: qqq_df['close'].iloc[-1] > qqq_5MH and qqq_5MH != -1 and market_trend == 'up'
    score: 4
    memo: qqq > 5MH and we going to call
  s6:
    cond: qqq_df['close'].iloc[-1] < qqq_5ML and qqq_5ML != -1 and market_trend == 'down'
    score: 4
    memo: qqq < 5ML and we going to put
  s7:
    cond: 1 == 1
    score: 0
    memo: place holder - ver2.0 of scoring.


