indicators:
  calculation_interval_seconds: 10
  print_last_few_rows: false
  details:
    one:
      active: true
      outputs_in_application_state:
        - EMA_9
      calculation: |
        df['EMA_9'] = df['close'].ewm(span=9, adjust=False).mean()
    two:
      active: true
      outputs_in_application_state:
        - EMA_20
      calculation: |
        df['EMA_20'] = df['close'].ewm(span=20, adjust=False).mean()
    three:
      active: true
      outputs_in_application_state:
        - EMA_50
      calculation: |
        df['EMA_50'] = df['close'].ewm(span=50, adjust=False).mean()
    outputs_in_application_state:
      active: true
      outputs_in_application_state:
        - VWAP
      memo: Session Volume Weighted Average Price
      calculation: |
        df['_tp']     = (df['high'] + df['low'] + df['close']) / 3
        df['_tp_vol'] = df['_tp'] * df['volume']
        df['_date']   = df.date
        df['VWAP']    = (df.groupby('_date')['_tp_vol'].transform('cumsum') /
                         df.groupby('_date')['volume'].transform('cumsum'))
        df.drop(columns=['_tp', '_tp_vol', '_date'], inplace=True)
    five:
      active: true
      outputs_in_application_state:
        - EMA_9_slope_pct
        - EMA_20_slope_pct
        - EMA_50_slope_pct
        - EMA_9_direction
        - EMA_20_direction
        - EMA_50_direction

      memo: slope_period controls how many bars back to compare — 3 bars on 1m = ~3 min lag
      calculation: |
        slope_period = 3
        threshold    = 0.02          # % — below this = flat
        for col in ['EMA_9', 'EMA_20', 'EMA_50']:
            slope = (df[col] - df[col].shift(slope_period)) / df[col].shift(slope_period) * 100
            df[f'{col}_slope_pct'] = slope
            df[f'{col}_direction'] = np.where(slope >  threshold, 'up',
                                    np.where(slope < -threshold, 'down', 'flat'))

