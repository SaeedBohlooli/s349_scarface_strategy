cases:
  case_2:
    memo: 5MH and 5ML breakout_ver_2, no short above PDH, trade close to level. - we running this one - 2.1 improved
    can_replace_level: true
    precondition: all_levels_in(application_state, symbol)
    color: blue
    long:
      level: levels['5MH']
      level_alias: "5MH"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True, level_alias=level_alias)
        - is_retest_after_breakout(application_state, symbol, side='up', level=long_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='up', level=long_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='up', level=long_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='up', price=price, level=long_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - skip_level_closeness_enabled or not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='up', price=price, current_level=long_level, next_levels=['PDH'])
        - abs (price - long_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and price > application_state['levels'][symbol]['PDL']
        - skip_pdhl_and_qqq_check_enabled or price < levels['PDH'] or get_current_price(ib, application_state, 'QQQ') > application_state['levels']['QQQ']['5MH'] # avoid going long above PDH - extra safety- if we are above PDH, low change we continue after 5MH breakout.
        - abs (price - long_level) < 2
        - qqq_df['close'].iloc[-1] > qqq_df['open'].iloc[-1]  # forming candle.

        # TODO get the range of 5MH and 5ML and check the current price is close to 5MHL and 5ML

    short:
      level: levels['5ML']
      level_alias: "5ML"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True ,level_alias=level_alias)
        - is_retest_after_breakout(application_state, symbol, side='down', level=short_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='down', level=short_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='down', level=short_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='down', price=price, level=short_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='down', price=price, current_level=short_level, next_levels=['PDL'])
        - abs (price - short_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and price < application_state['levels'][symbol]['PDH'] # avoid going long above PDH - extra safety- if we are above PDH, low change we continue after 5MH breakout
        - price > levels['PDL'] or get_current_price(ib, application_state, 'QQQ') < application_state['levels']['QQQ']['5ML']
        - abs (price - short_level) < 2
        - qqq_df['close'].iloc[-1] < qqq_df['open'].iloc[-1]

  case_4:
    memo: From PDH PDL - we running this one
    can_replace_level: false
    precondition: all_levels_in(application_state, symbol)
    color: green
    long:
      level: levels['PDH']
      level_alias: "PDH"
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True, level_alias=level_alias)
        - is_retest_after_breakout(application_state, symbol, side='up', level=long_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='up', level=long_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='up', ohlc_field='close',level=long_level)
        - check_price_vs_level(app_config, symbol, side='up', price=price, level=long_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - levels['PDH'] < levels['5MH'] or get_current_price(ib, application_state, 'QQQ') > application_state['levels']['QQQ']['5MH']
        - abs (price - long_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and ( skip_level_closeness_enabled or ( not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='up', price=price, current_level=long_level, next_levels=['5MH'])))
        - abs (price - long_level) < 2
        - qqq_df['close'].iloc[-1] >= qqq_df['open'].iloc[-1]

    short:
      level: levels['PDL']
      level_alias: "PDL"
      memo: conditon 8 need to be checeked
      cores:
        - breakout_in_last_x_candles_ver_4(app_config, application_state, case, symbol, df, side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3,-4], level=short_level, both_sides=True, level_alias=level_alias)
        - is_retest_after_breakout(application_state, symbol, side='down', level=short_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='down', level=short_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='down', ohlc_field='close',level=short_level)
        - check_price_vs_level(app_config, symbol, side='down', price=price, level=short_level )
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - levels['PDL'] > levels['5ML'] or get_current_price(ib, application_state, 'QQQ') < application_state['levels']['QQQ']['5ML']
        - abs (price - short_level) < 1.2 * atr_14
        # 10
        - 10 == 10 and not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='down', price=price, current_level=short_level, next_levels=['PML'])
        - not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='down', price=price, current_level=short_level, next_levels=['5ML'])
        - abs (price - short_level) < 2
        - qqq_df['close'].iloc[-1] <= qqq_df['open'].iloc[-1]


  case_5:
#    Displacement + Retracement BnR from 5MH/5ML.
#    Requires a strong displacement candle (range >= 0.5x ATR, body >= 60%,
#    close in top/bottom 70% of range), then a structured retracement back to
#    the level (max 65% retrace, candle must close back on correct side of level).
#    SL is anchored to the retracement candle extreme at entry time.
    memo: new BNR

    can_replace_level: false
    precondition: all_levels_in(application_state, symbol)
    color: purple
    long:
      level: levels['5MH']
      level_alias: "5MH"
      cores:
        # 1. Displacement breakout: range >= 0.5x ATR, body >= 60%, close in top 70%
        - breakout_with_displacement(app_config, application_state, case, symbol, df, side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level, level_alias=level_alias, min_displacement_atr_ratio=0.5, min_body_ratio=0.6, close_in_top_pct=0.70)
        # 2. Retracement back to level zone — max 65% retrace, close must confirm above level
        - price_retracement_to_level(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3,-4,-5,-6], level=long_level, level_alias=level_alias, max_retrace_ratio=0.65)
        # 3. Retracement happened AFTER the breakout
        - is_retest_after_breakout(application_state, symbol, side='up', level=long_level)
        # 4. Gap between breakout and retracement candle is within 6 bars
        - is_retracement_gap_acceptable(application_state, symbol, level=long_level, max_gap=6)
        - price > long_level

      extras:
        # 5. Current forming candle breaks above the retracement candle high
        - check_entry_vs_retest(application_state, case, symbol, df, side='up', level=long_level)
        # 6. No close failures between displacement and now
        - no_failure_after_breakout(application_state, case, symbol, df, side='up', level=long_level, ohlc_field='close')
        # 7. Entry price still close to the level (not chasing)
        - check_price_vs_level(app_config, symbol, side='up', price=price, level=long_level)
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
        # Tighter proximity than case_2: 0.8x ATR instead of 1.2x
        - abs(price - long_level) < 0.8 * atr_14
        - abs(price - long_level) < 2
        - price > application_state['levels'][symbol]['PDL']
        - skip_pdhl_and_qqq_check_enabled or price < levels['PDH'] or get_current_price(ib, application_state, 'QQQ') > application_state['levels']['QQQ']['5MH']
        - qqq_df['close'].iloc[-1] > qqq_df['open'].iloc[-1]
        - skip_level_closeness_enabled or not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='up', price=price, current_level=long_level, next_levels=['PDH'])

    short:
      level: levels['5ML']
      level_alias: "5ML"
      cores:
        - breakout_with_displacement(app_config, application_state, case, symbol, df, side='down', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=short_level, level_alias=level_alias, min_displacement_atr_ratio=0.5, min_body_ratio=0.6, close_in_top_pct=0.70)
        - price_retracement_to_level(app_config, application_state, case, symbol, df, side='down', idx_list=[-2,-3,-4,-5,-6], level=short_level, level_alias=level_alias, max_retrace_ratio=0.65)
        - is_retest_after_breakout(application_state, symbol, side='down', level=short_level)
        - is_retracement_gap_acceptable(application_state, symbol, level=short_level, max_gap=6)
        - price < short_level
      extras:
        - check_entry_vs_retest(application_state, case, symbol, df, side='down', level=short_level)
        - no_failure_after_breakout(application_state, case, symbol, df, side='down', level=short_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='down', price=price, level=short_level)
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
        - abs(price - short_level) < 0.8 * atr_14
        - abs(price - short_level) < 2
        - price < application_state['levels'][symbol]['PDH']
        - price > levels['PDL'] or get_current_price(ib, application_state, 'QQQ') < application_state['levels']['QQQ']['5ML']
        - qqq_df['close'].iloc[-1] < qqq_df['open'].iloc[-1]
        - not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='down', price=price, current_level=short_level, next_levels=['PDL'])

