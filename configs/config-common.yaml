        - not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='down', price=price, current_level=short_level, next_levels=['PDH'])
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
