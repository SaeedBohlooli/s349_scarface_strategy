htf:
  enabled: true
  use_htf_entry: true       # false = compute HTF levels but don't block entries
  use_htf_tp: true          # false = compute HTF levels but use config % TPs only
  refresh_interval_sec: 900  # 15 minutes
  timeframes: ['1D', '4H', '30m', '15m']
  timeframe_weights:
    1D: 1.0
    4H: 0.8
    30m: 0.6
    15m: 0.4
  swing_lookback: 5          # bars on each side to confirm a swing high/low
  min_reversal_atr: 0.3      # minimum move after swing to confirm it (in ATR multiples)
  zone_merge_atr: 0.5        # merge levels within this ATR distance into one zone
  min_clearance_atr: 1.0     # entry blocked if nearest HTF level < this ATR distance
  min_tp_distance_atr: 0.3   # HTF TP level must be at least this far from entry
  tp_close_percentages: [0.60, 0.20, -1]  # close % at each HTF TP level (nearest to furthest)


scoring:
  enabled: true
  gate_enabled: true    # false = compute scores for observation but don't block orders
  weights:
    rs_delta: 0.25
    rs_roc: 0.20
    ema_alignment: 0.20
    vwap_position: 0.15
    level_distance: 0.10
    breakout_recency: 0.10
  ema_periods: [9, 21]
  leader_threshold: 60        # composite score >= 60 to qualify as leader (for longs)
  laggard_threshold: 40       # composite score <= 40 to qualify as laggard (for shorts)
  top_n: 3                    # alternative: top N symbols qualify
  use_threshold: true         # true = threshold mode, false = top_n mode


cases:
  case_2_1_async:
    memo: 5MH and 5ML breakout_ver_2, no short above PDH, trade close to level. - we running this one
    can_replace_level: true
    precondition: all_levels_in(application_state, symbol)
    color: blue
    long:
      level: levels['5MH']
      level_alias: '5MH'
      cores:
        - breakout_in_last_x_candles_ver_2(app_config, application_state, case, symbol, df, side='up', idx_list=[-3,-4,-5,-6,-7,-8,-9,-10,-11], level=long_level, level_alias=level_alias)
        - price_retest(app_config, application_state, case, symbol, df, side='up', idx_list=[-2,-3,-4], level=long_level, both_sides=True, level_alias=level_alias)
        - is_retest_after_breakout(application_state, symbol, side='up', level=long_level)
        - check_entry_vs_retest(application_state, case, symbol, df, side='up', level=long_level)
        # 5
        - no_failure_after_breakout(application_state, case, symbol, df, side='up', level=long_level, ohlc_field='close')
        - check_price_vs_level(app_config, symbol, side='up', price=price, level=long_level )
        - not is_price_close_to_next_levels_ver_2(app_config, application_state, symbol, df, side='up', price=price, current_level=long_level, next_levels=['PDH'])
        - 930 < get_last_record_hh_mm(df) < 1016 or get_mode(application_state) == 'live'
      extras:
        - abs (price - long_level) < 1.2 * atr_14
        # 10
        - price > application_state['levels'][symbol]['PDL']
#        - get_current_price(ib, application_state, 'QQQ') > application_state['levels']['QQQ']['PDL']
        - price < levels['PDH'] # avoid going long above PDH - extra safety- if we are above PDH, low change we continue after 5MH breakout
