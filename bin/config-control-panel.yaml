control_panel:
  projectName: 349 Control Panel P
  browserTitle: 349 Control Panel P
  # Server ports
  ports:
    vite: 7349
    websocket: 6349
    api: 5349

  # WebSocket configuration
  websocket:
    url: ws://127.0.0.1:6349
    reconnect:
      initialDelay: 1000
      maxDelay: 30000
      backoffMultiplier: 2

  # API configuration
  api:
    baseUrl: http://127.0.0.1:5349
    endpoints:
      sendRequest: /api/send-request

  # Message types
  messageTypes:
    applicationState: application_state
    appConfig: app_config
  # Footer configuration
  footer:
    text: "Trading Control Panel Dashboard @ ZoiTek.com   2014 - 2025 P"
    link: "https://zoitek.com"