<!DOCTYPE html>
<html>
<head>
    <title>Backtest Charts</title>
</head>
<body style="background-color: #fafafa; font-family: Arial, sans-serif;">
    <h2>Select Backtest Date</h2>

    <!-- 🟢 Form sends backtest_date via GET -->
    <form method="get" action="/">
        <label for="backtest_date">Backtest Date:</label>
        <select name="backtest_date" id="backtest_date" onchange="this.form.submit()">
            {% for date in available_dates %}
                <option value="{{ date }}" {% if backtest_date == date %}selected{% endif %}>
                    {{date}}
                </option>
            {% endfor %}
        </select>
    </form>


    <hr>

    {% for plot in plots %}
        <div>{{ plot|safe }}</div>
    {% endfor %}
</body>
</html>
