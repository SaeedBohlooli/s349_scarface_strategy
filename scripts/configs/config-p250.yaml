stop_losses:
  C:
    stop_loss_condition: underlying_previous_candle_close < level_used_to_open - tolerance_amount and ( level_used_to_open != -1)
#    stop_loss_condition:  symbol == 'AMD' or 1 == 2

  P:
    stop_loss_condition: underlying_previous_candle_close > level_used_to_open + tolerance_amount and ( level_used_to_open != -1)
#    stop_loss_condition:  symbol == 'AMD' or 1 == 1


take_profits:
  t1:
    condition: current_ask > avg_cost_for_1_contract * 1.3 and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.5

  t2:
    condition: current_ask > avg_cost_for_1_contract * 1.5  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.25

  t3:
    condition: current_ask > avg_cost_for_1_contract * 1.6  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: -1
    # -1 closes all the rest

