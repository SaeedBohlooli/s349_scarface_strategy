run_should_take_seconds: 15

back_test:
  get_data_from_ib: false
#  get_data_from_ib: False

  historical_days: 5 D
  start_date: 2025-10-27

  back_test_date_start: 2025-10-01
  back_test_date_end: 2025-10-30

chart:
#  source: live
  source: back_test
  1m_candles: 2000
  cutoff_in_hours: 0
  hours_in_focus: 2

# stop_loss_condition: 1 == 2 and symbol == 'AMD'
exit: false
rights:
  C:
    stop_loss_condition: underlying_previous_candle_close < level_used_to_open
  P:
    stop_loss_condition: underlying_previous_candle_close > level_used_to_open


take_profits:
  t1:
    condition: current_ask > avg_cost_for_1_contract * 1.4 and ( avg_cost_for_1_contract != -1 and current_ask != -1)
#    condition: current_ask > avg_cost_for_1_contract * 0.2 and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.5
    reset_stop_loss: true
    reset_stop_loss_price: underlying_open_price

  t2:

    condition: current_ask > avg_cost_for_1_contract * 1.6  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.25

  t3:
    condition: current_ask > avg_cost_for_1_contract * 1.7  and ( avg_cost_for_1_contract != -1 and current_ask != -1)
    close_quantity_percentage: 0.25
